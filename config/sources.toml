# RSS/Atom sources available to the Researcher agent.
# The fetch_rss tool accepts ONLY the `id` values listed here (enabled = true).
#
# Availability checked on 2026-10-11 (HTTP 200, valid RSS 2.0):
#   openai_news       https://openai.com/news/rss.xml                         ~1300 items, short descriptions
#   huggingface_blog  https://huggingface.co/blog/feed.xml                    empty descriptions (title-only excerpts)
#   aws_whats_new     https://aws.amazon.com/about-aws/whats-new/recent/feed/ 100 items, mostly non-AI -> interest_filter
#
# Fields:
#   interest_filter  keep only entries whose title/excerpt mention a user interest or an AI keyword
#   max_entries      max entries from this source passed to the model per request (after time filter)

[[sources]]
id = "openai_news"
name = "OpenAI News"
url = "https://openai.com/news/rss.xml"
enabled = true
interest_filter = false
max_entries = 10

[[sources]]
id = "huggingface_blog"
name = "Hugging Face Blog"
url = "https://huggingface.co/blog/feed.xml"
enabled = true
interest_filter = false
max_entries = 10

[[sources]]
id = "aws_whats_new"
name = "AWS What's New"
url = "https://aws.amazon.com/about-aws/whats-new/recent/feed/"
enabled = true
interest_filter = true
max_entries = 10
