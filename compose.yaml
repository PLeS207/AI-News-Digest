name: ai-news-digest

# Four runtime services: openclaw (Coordinator agent), researcher (A2A agent), app (Telegram + backend
# tools + delivery), dashboard. openclaw-init prepares the isolated OpenClaw state before start.
# Secrets are passed per service: Telegram only to app, Anthropic only to openclaw and researcher.

x-python: &python
  build: .
  image: ai-news-digest:local
  restart: unless-stopped

x-openclaw-image: &openclaw-image ghcr.io/openclaw/openclaw:2026.9.9

services:
  openclaw-init:
    image: *openclaw-image
    user: "0:0"
    entrypoint: ["node", "/opt/digest/init.mjs"]
    environment:
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_EDITOR_MODEL: "anthropic/${ANTHROPIC_MODEL:-claude-opus-5-5}"
      OPENCLAW_THINKING: "${OPENCLAW_THINKING:-low}"
    volumes:
      - ./openclaw:/opt/digest:ro
      - openclaw_state:/home/node/.openclaw
      - openclaw_workspace:/workspace
      - openclaw_traces:/traces/openclaw
    restart: "no"

  openclaw:
    image: *openclaw-image
    init: true
    restart: unless-stopped
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--port", "18789"]
    environment:
      HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_GATEWAY_TOKEN: "${OPENCLAW_GATEWAY_TOKEN:?Set OPENCLAW_GATEWAY_TOKEN in .env (openssl rand -hex 32)}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      - openclaw_state:/home/node/.openclaw
      - openclaw_workspace:/workspace
      - openclaw_traces:/traces/openclaw
      - ./openclaw/plugins:/opt/digest/plugins:ro
    expose:
      - "18789"     # Compose network only; not published on the host
    # SIGTERM lets the Gateway release its state lease; after a hard kill a restart waits up to 5 min.
    stop_grace_period: 60s
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  researcher:
    <<: *python
    command: ["python", "-m", "ai_news_digest.researcher.server"]
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-opus-5-5}"
      ANTHROPIC_EFFORT: "${ANTHROPIC_EFFORT:-low}"
      ANTHROPIC_REFUSAL_FALLBACK: "${ANTHROPIC_REFUSAL_FALLBACK:-true}"
      AGENT_MAX_ITERATIONS: "${AGENT_MAX_ITERATIONS:-4}"
      AGENT_MAX_TOOL_CALLS: "${AGENT_MAX_TOOL_CALLS:-8}"
      RSS_MAX_TOTAL_ENTRIES: "${RSS_MAX_TOTAL_ENTRIES:-30}"
      RESEARCHER_HOST: 0.0.0.0
      RESEARCHER_PORT: "9100"
      RESEARCHER_PUBLIC_URL: http://researcher:9100   # advertised in the Agent Card (Compose network)
      TRACE_DIR: /data/traces
      SOURCES_FILE: /app/config/sources.toml
    volumes:
      - researcher_traces:/data/traces
      - ./config:/app/config:ro    # edit sources.toml + `docker compose restart researcher app`
    expose:
      - "9100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/.well-known/agent-card.json', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    <<: *python
    command: ["python", "-m", "ai_news_digest.telegram_bot"]
    depends_on:
      researcher:
        condition: service_healthy
      openclaw:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      ALLOWED_TELEGRAM_USER_ID: "${ALLOWED_TELEGRAM_USER_ID:-}"
      OPENCLAW_GATEWAY_TOKEN: "${OPENCLAW_GATEWAY_TOKEN:?Set OPENCLAW_GATEWAY_TOKEN in .env (openssl rand -hex 32)}"
      OPENCLAW_URL: http://openclaw:18789
      OPENCLAW_AGENT_ID: editor
      RESEARCHER_URL: http://researcher:9100
      A2A_TIMEOUT_SECONDS: "${A2A_TIMEOUT_SECONDS:-300}"
      A2A_MAX_ATTEMPTS: "${A2A_MAX_ATTEMPTS:-2}"
      DEFAULT_LANGUAGE: "${DEFAULT_LANGUAGE:-ru}"
      DEFAULT_MAX_ITEMS: "${DEFAULT_MAX_ITEMS:-5}"
      DEFAULT_PERIOD_HOURS: "${DEFAULT_PERIOD_HOURS:-72}"
      EDITOR_DB_PATH: /data/editor/memory.sqlite3   # same volume/path as before the migration
      TRACE_DIR: /data/traces
      SOURCES_FILE: /app/config/sources.toml
    volumes:
      - editor_memory:/data/editor
      - editor_traces:/data/traces
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time, sys; sys.exit(0 if time.time() - os.path.getmtime('/tmp/app-heartbeat') < 90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  dashboard:
    <<: *python
    # No secrets: the dashboard only reads trace files from read-only mounts.
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501",
              "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      TRACE_FILES: >-
        /traces/app/app/events.jsonl,/traces/app/editor/events.jsonl,/traces/researcher/researcher/events.jsonl,/traces/openclaw/events.jsonl
    volumes:
      - editor_traces:/traces/app:ro
      - researcher_traces:/traces/researcher:ro
      - openclaw_traces:/traces/openclaw:ro
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  editor_memory:      # app SQLite memory (pre-migration name kept: existing data survives)
  editor_traces:      # app traces (+ legacy editor traces)
  researcher_traces:
  openclaw_state:     # isolated OpenClaw state: config, sessions, agent DBs
  openclaw_workspace: # editor workspace copied from ./openclaw/workspace on every start
  openclaw_traces:    # digest-telemetry plugin hook events
