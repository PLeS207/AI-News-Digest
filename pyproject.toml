[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-digest"
version = "0.1.0"
description = "Personal Telegram AI news digest: Editor and Researcher LLM agents talking over the A2A protocol"
readme = "README.md"
requires-python = ">=3.12"
# Exact pins live in requirements.txt (used by Docker and the test instructions).
dependencies = [
    "a2a-sdk[http-server]==1.2.2",
    "anthropic==1.13.0",
    "python-telegram-bot==22.8",
    "feedparser==6.0.14",
    "httpx==0.28.1",
    "pydantic==2.14.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dashboard = ["streamlit==1.65.0", "pandas"]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
